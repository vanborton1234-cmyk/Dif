<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العاصفة الثلجية ❄️</title>
    <style>
        /* --- المتغيرات والتصميم الثلجي --- */
        :root {
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --text-color: #333;
            --bg-body: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --btn-text: white;
        }

        /* --- الوضع الليلي (Dark Mode) --- */
        body.dark-mode {
            --primary-color: #0088cc;
            --secondary-color: #1a1a1a;
            --glass-bg: rgba(30, 30, 30, 0.9);
            --text-color: #f0f0f0;
            --bg-body: #121212;
            --btn-text: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* --- زر تبديل الوضع --- */
        .theme-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--glass-bg);
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { color: var(--secondary-color); margin-bottom: 20px; transition: 0.3s; }
        body.dark-mode h1 { color: #fff; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; outline: none; }
        button.main-btn { padding: 15px 30px; background: linear-gradient(to right, var(--secondary-color), var(--primary-color)); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        
        .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* طبقة تحكم بالسرعة */
        .touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; display: flex; justify-content: center; align-items: center; color: white; font-size: 1.5rem; opacity: 0; transition: 0.3s; }
        .speed-indicator { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 10px; display: none; z-index: 20; }

        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .ctrl-btn { background: white; border: 1px solid var(--secondary-color); color: var(--secondary-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        body.dark-mode .ctrl-btn { background: #333; color: white; border-color: #555; }
        .ctrl-btn:hover { background: var(--secondary-color); color: white; }
        
        /* زر التنزيل */
        .download-btn { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 20px; text-decoration: none; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️</button>

    <div class="container">
        <h1>منصة العاصفة الثلجية ❄️</h1>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="الصق رابط اليوتيوب هنا...">
            <button class="main-btn" onclick="loadVideo()">تشغيل ❄️</button>
        </div>

        <div class="video-wrapper" id="videoWrapper">
            <div id="player"></div>
            <div class="touch-overlay" id="touchOverlay"></div>
            <div class="speed-indicator" id="speedIndicator">⚡ سرعة 3x</div>
        </div>

        <div class="controls" id="controlsPanel" style="display: none;">
            <button class="ctrl-btn" onclick="setSpeed(1)">عادي</button>
            <button class="ctrl-btn" onclick="setSpeed(3)">سرعة 3x</button>
            <a href="#" id="downloadLink" target="_blank" class="download-btn">📥 تنزيل الفيديو (خارجي)</a>
        </div>
    </div>

    <script>
        // --- ميزة الوضع الليلي ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // --- تهيئة يوتيوب API ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var currentVideoId = "";

        function onYouTubeIframeAPIReady() {}

        function createPlayer(videoId) {
            currentVideoId = videoId;
            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    playerVars: {
                        'playsinline': 1,
                        'controls': 1,
                        'rel': 0,
                        'modestbranding': 1
                    },
                    events: {
                        'onReady': onPlayerReady
                    }
                });
            }
            document.getElementById('videoWrapper').style.display = 'block';
            document.getElementById('controlsPanel').style.display = 'flex';
            document.getElementById('downloadLink').style.display = 'inline-block';
            // تحديث رابط التنزيل (يستخدم موقع y2mate كمثال)
            document.getElementById('downloadLink').href = "https://www.y2mate.com/youtube/" + videoId;
        }

        function onPlayerReady(event) {
            event.target.setPlaybackQuality('tiny'); // جودة منخفضة للنت الضعيف
            setupTouchControls();
        }

        function loadVideo() {
            const url = document.getElementById('videoUrl').value;
            const videoId = extractVideoID(url);
            if(videoId) {
                createPlayer(videoId);
            } else {
                alert("رابط غير صحيح!");
            }
        }

        function extractVideoID(url) {
            var regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            var match = url.match(regExp);
            return (match && match[7].length == 11) ? match[7] : false;
        }

        function setSpeed(rate) {
            if(player) player.setPlaybackRate(rate);
        }

        // --- منطق الضغط المطول للسرعة ---
        function setupTouchControls() {
            const overlay = document.getElementById('touchOverlay');
            const indicator = document.getElementById('speedIndicator');
            
            const startSpeed = () => {
                indicator.style.display = 'block';
                player.setPlaybackRate(3);
            };

            const stopSpeed = () => {
                indicator.style.display = 'none';
                player.setPlaybackRate(1);
            };

            overlay.addEventListener('mousedown', startSpeed);
            overlay.addEventListener('mouseup', stopSpeed);
            overlay.addEventListener('mouseleave', stopSpeed);
            
            overlay.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startSpeed();
            });
            overlay.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopSpeed();
            });
        }
    </script>
</body>
</html>
